<div class="max-w-7xl mx-auto p-6 md:p-8">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <div>
      <h2 class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
        All Parcels
      </h2>
      <p class="text-gray-500 mt-1">Manage and track all your shipments in one place</p>
    </div>

    <button routerLink="/newParcel"
            class="new-btn px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transform transition-all duration-300 flex items-center gap-2">
      <span class="text-xl">+</span> New Parcel
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
    <div class="animate-pulse">
      <div class="h-16 bg-gray-100"></div>
      <div class="p-6 space-y-4">
        <div class="h-12 bg-gray-100 rounded-lg"></div>
        <div class="h-12 bg-gray-100 rounded-lg"></div>
        <div class="h-12 bg-gray-100 rounded-lg"></div>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl text-center">
    <p class="font-medium">Oops! Something went wrong.</p>
    <p class="text-sm mt-1">{{ error }}</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && parcels.length === 0"
       class="bg-white rounded-2xl shadow-lg border border-gray-200 p-16 text-center">
    <div class="mx-auto w-32 h-32 bg-gray-100 rounded-full flex items-center justify-center mb-6">
      <i class="fas fa-box-open text-5xl text-gray-400"></i>
    </div>
    <h3 class="text-2xl font-semibold text-gray-800 mb-2">No Parcels Found</h3>
    <p class="text-gray-500 mb-6">Start by creating your first shipment!</p>
    <button routerLink="/newParcel"
            class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-700 text-white font-semibold rounded-xl hover:shadow-lg transition-all duration-300">
      + Create New Parcel
    </button>
  </div>

  <!-- Parcels Table (Only show if data exists) -->
  <div *ngIf="!loading && parcels.length > 0"
       class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gradient-to-r from-gray-50 to-gray-100">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">No.</th>
            <th class="px-6 py-4 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">From</th>
            <th class="px-6 py-4 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">To</th>
            <th class="px-6 py-4 text-left text-xs font-bold text-gray-700 uppercase tracking-wider">Tracking No.</th>
            <th class="px-6 py-4 text-right text-xs font-bold text-gray-700 uppercase tracking-wider">Cost</th>
            <th class="px-6 py-4 text-center text-xs font-bold text-gray-700 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
          <tr *ngFor="let parcel of parcels; let i = index"
              class="hover:bg-indigo-50/50 transition-colors duration-200 cursor-pointer"
              [routerLink]="['/parcel/view/', parcel.trackingNumber]">
            
            <td class="px-6 py-5 text-sm font-medium text-gray-900">{{ i + 1 }}</td>
            <td class="px-6 py-5 text-sm text-gray-900 font-medium">{{ parcel.from }}</td>
            <td class="px-6 py-5 text-sm text-gray-900 font-medium">{{ parcel.to }}</td>
            <td class="px-6 py-5 text-sm font-mono text-indigo-600 font-semibold">{{ parcel.trackingNumber }}</td>
            <td class="px-6 py-5 text-right text-sm">
              <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-sm">
                ${{ parcel.cost }}
              </span>
            </td>
           
            <td class="px-6 py-5 text-center" (click)="$event.stopPropagation()">
              <div class="flex items-center justify-center gap-3">
                <!-- View -->
                <button class="group p-2.5 rounded-lg hover:bg-blue-100 transition-colors"
                        [routerLink]="['/parcel/view/', parcel.trackingNumber]"
                        title="View Details">
                  <fa-icon [icon]="icons" class="text-blue-600 text-lg group-hover:scale-110 transition-transform"></fa-icon>
                </button>

                <!-- Edit -->
                <button class="group p-2.5 rounded-lg hover:bg-green-100 transition-colors"
                        [routerLink]="['/parcel/edit/', parcel.trackingNumber]"
                        title="Edit Parcel">
                  <fa-icon [icon]="edit" class="text-green-600 text-lg group-hover:scale-110 transition-transform"></fa-icon>
                </button>

                <!-- Delete -->
                <button class="group p-2.5 rounded-lg hover:bg-red-100 transition-colors"
                        (click)="onDelete(parcel.trackingNumber)"
                        title="Delete Parcel">
                  <fa-icon [icon]="delete" class="text-red-600 text-lg group-hover:scale-110 transition-transform"></fa-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
