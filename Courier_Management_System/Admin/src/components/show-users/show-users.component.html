<div class="user-container max-w-7xl mx-auto p-6">

  <!-- Header with Stats -->
  <div class="mb-8">
    <div class="flex justify-between items-start mb-6">

      <div>
        <h2 class="text-4xl font-bold mb-2">
          <span class="bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 bg-clip-text text-transparent">
            User Management
          </span>
        </h2>

        <p class="text-gray-600 text-sm flex items-center gap-2">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>

          {{ users.length }} active users
        </p>
      </div>

      <button
        class="group relative px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 rounded-xl text-white font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200"
        routerLink="/newuser"
        >
        <span class="flex items-center gap-2">
          <fa-icon [icon]="plus" class=" text-indigo-600 text-xl"></fa-icon>

          New User
        </span>
      </button>
    </div>


    <!-- Quick Stats Cards -->

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div
        class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-600 font-medium">Total Users</p>
            <p class="text-2xl font-bold text-indigo-600">{{ users.length }}</p>
          </div>
          <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
            <fa-icon [icon]="userIcon" class=" text-indigo-600 text-xl"></fa-icon>
          </div>
        </div>
      </div>



      <div
        class="bg-gradient-to-br from-purple-50 to-pink-50 border border-purple-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-600 font-medium">Total Parcels</p>
            <p class="text-2xl font-bold text-purple-600">{{ getTotalParcels() }}</p>
          </div>
          <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
            <fa-icon [icon]="box" class=" text-indigo-600 text-xl"></fa-icon>
          </div>
        </div>
      </div>

      <div
        class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-600 font-medium">Avg Parcels/User</p>
            <p class="text-2xl font-bold text-amber-600">{{ getAvgParcels() }}</p>
          </div>
          <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
            <i class="fas fa-chart-line text-amber-600 text-xl"></i>
          </div>
        </div>
      </div>

    </div>
  </div>


  <!-- Modern Card Grid Layout (Alternative to Table) -->


  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

    <div *ngFor="let user of users; let i = index" class="row-anim group relative bg-white rounded-2xl 
        p-6 border border-gray-200 hover:border-purple-300
        hover:shadow-xl transition-all duration-300 cursor-pointer">
      <!-- Card Header -->
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div
            class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">
            {{ user.fullName.charAt(0) }}
          </div>

          <div>
            <h3 class="font-bold text-gray-900 text-lg group-hover:text-purple-600 transition-colors">
              {{ user.fullName }}
            </h3>
            <p class="text-xs text-gray-500">User #{{ i + 1 }}</p>
          </div>
        </div>

        <button class="opacity-0 group-hover:opacity-100 transition-opacity p-2 hover:bg-red-50 rounded-lg">
          <fa-icon [icon]="trash" class="text-red-500 hover:text-red-600"></fa-icon>
        </button>
      </div>

      <!-- Card Body -->
      <div class="space-y-3">
        <div class="flex items-center gap-2 text-sm text-gray-600">
          <fa-icon [icon]="envelope" class="  w-3"></fa-icon>
          <span class="truncate">{{ user.email }}</span>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
          <span class="text-xs text-gray-500 font-medium">Parcels</span>
          <span class="px-3 py-1 bg-gradient-to-r
             from-purple-100
              to-pink-100 text-purple-700 
              rounded-full text-sm font-bold">
            {{ user.no_of_parcels }}
          </span>
        </div>
      </div>

    </div>
  </div>
</div>
