<div class="w-full h-full p-10">

    <!-- Greeting -->
    <h1 class="text-3xl font-semibold text-gray-800">
        Welcome Admin 👋
    </h1>

    <!-- Stats row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl mx-auto mt-10 px-4">
        <app-stat-card 
        *ngFor="let s of stats" 
        [title]="s.title"
         [value]="s.value" 
         [up]="s.up" 
         [down]="s.down" />
    </div>

</div>
