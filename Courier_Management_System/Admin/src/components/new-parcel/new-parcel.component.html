<div class=" bg-gradient-to-br m-[20px] from-gray-500 to-gray-900 py-12 px-4">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden animate-fadeIn">
      <div class="bg-gradient-to-r from-teal-500 to-blue-600 px-10 py-8">
        <h2 class="text-3xl font-bold text-white">Create New Parcel</h2>
        <p class="text-teal-100 mt-2">Fill in the details to register a new shipment</p>
      </div>

      <form [formGroup]="parcelForm" (ngSubmit)="onSubmit()" class="p-10 grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Tracking Number -->
        <div class="group">
          <label class="block text-sm font-medium text-gray-950 mb-2">Tracking Number</label>
          <input
            type="text"
            formControlName="trackingNumber"
            placeholder="TRK-123456"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Weight -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Weight</label>
          <input
            type="number"
            formControlName="weight"
            placeholder="20"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
          <span class="text-sm text-gray-500 mt-1 inline-block">grams</span>
        </div>

        <!-- From -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">From</label>
          <input
            type="text"
            formControlName="from"
            placeholder="Ontario, USA"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- To -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">To</label>
          <input
            type="text"
            formControlName="to"
            placeholder="Saint Mary, USA"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Sender Name -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Sender Name</label>
          <input
            type="text"
            formControlName="senderName"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Recipient Name -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Recipient Name</label>
          <input
            type="text"
            formControlName="recipientName"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Sender Email -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Sender Email</label>
          <input
            type="email"
            formControlName="senderEmail"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Recipient Email -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Recipient Email</label>
          <input
            type="email"
            formControlName="recipientEmail"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Cost -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Cost</label>
          <input
            type="number"
            formControlName="cost"
            placeholder="0.00"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
          <span class="text-sm text-gray-500 mt-1 inline-block">$ USD</span>
        </div>

        <!-- Date -->
        <div class="group">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Shipping Date</label>
          <input
            type="date"
            formControlName="date"
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 bg-white/70"
          />
        </div>

        <!-- Note -->
        <div class="group md:col-span-2">
          <label class="block text-sm font-medium  text-gray-950 mb-2">Note (optional)</label>
          <textarea
            formControlName="note"
            rows="4"
            placeholder="Any special instructions..."
            class="w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-teal-500/30 focus:border-teal-500 transition-all duration-300 resize-none bg-white/70"
          ></textarea>
        </div>

        <!-- Submit -->
        <div class="md:col-span-2 flex justify-end">
          <button
            type="submit"
            class="px-10 py-4 bg-gradient-to-r from-teal-500 to-blue-600 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transform transition-all duration-300"
          >
            Create Parcel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
